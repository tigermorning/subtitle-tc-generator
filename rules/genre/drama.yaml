schema_version: 1

# 드라마 — **멜로도 여기에 들어간다.** 사용자 확인: "멜로는 일반 대화체이면 된다."
# 빈 프로파일을 하나 더 만들면 상속만 늘고 얻는 것이 없다.
#
# 느와르도 별도 프로파일을 만들지 않았다. 거친 표현·욕설은 이미 **플랫폼 규정**이
# 정한다(`censorship.allowed: false` = 검열 금지 = 동등 강도로 옮긴다). 장르가 아니라
# **캐릭터**가 그 인물이 그렇게 말하는지를 정한다 — 캐릭터 분석 문서의 일이다
# (`checker/characters.py`).
genre: drama
label: "드라마 (멜로·느와르 포함)"

source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료/작업 기본 원칙.txt)"
  section: "590·658·659행"
  revision: "2026-08-12"
  verified: "2026-08-12"

formality:
  # 말투는 장르가 정하지 않는다. **인물 관계가 정한다** — 플랫폼 프로파일의
  # `formality.decide_by: [context, relationship, era]`가 이미 그렇게 적고 있고,
  # `never_decide_by: [gender_only, age_only]`로 못 박아 두었다.
  #
  # 작업 원칙은 "극소수의 예외를 제외하고 모두 서로서로 존댓말"이다. 관계를 모를 때
  # 존댓말로 두는 것은 이미 1차 번역 프롬프트가 하고 있다.
  prefer: null
  polite_allowed: true

address:
  forbid_ssi: false                 # 658행: "드라마에선 가능"
  forbid_super_honorific: false     # 659행: "드라마에선 가능"

spotting:
  recommended_ms: [2000, 3000]
  recommended_note: "드라마 권장 2~3초 (작업자 자료 590행)"

# **같은 590행 근거를 병합 단계(regroup.py)에도 적용한다** — 2026-08-30, 메이드
# 인 코리아(디즈니+) E01~05를 mkv에 실제로 박혀 있던 정식 한국어 SDH 트랙과
# 전수 대조해 발견: 병합 기본 상한(4000ms, `regroup.MAX_DURATION_MS`)이 드라마
# 권장(2~3초)보다 훨씬 커서, 정답보다 표시 시간이 거의 2배(회차마다 2900~4400ms
# vs 정답 1794~2127ms)로 나오고 자막 개수는 정답의 60~70%(395~656 vs 755~961)에
# 그쳤다. 5회차 전부 같은 방향으로 어긋나 우연이 아니다. `variety.yaml`이 이미
# 같은 590행 근거로 예능 쪽을 고친 것과 같은 방식 — 권장 상한(3000ms)을 병합
# 상한으로 그대로 쓴다.
timecode:
  merge_max_ms: 3000
  merge_max_gap_ms: 250
  # **절 경계에서도 자른다(2026-08-30)** — 드라마B E01을 정답과
  # 단어 단위로 대조해 발견: 정답이 자막을 가르는 자리의 44.5%가 whisper
  # 조각 **안**이었다. 그 자리의 말소리 간격을 재 보니 조각 사이와 다르지
  # 않았다(간격 0~50ms인 곳도 7.3%는 정답이 갈랐다) — 침묵이 아니라 **절이
  # 끝나는 자리**를 기준으로 가르는 것이다. 소리 신호로는 못 잡으니 텍스트
  # 기준(`resplit.py`의 절 경계 정규식)으로 강제한다. `min_piece_chars`로
  # 너무 짧은 조각(한 어절짜리)까지 쪼개는 것은 막는다.
  force_clause_split: true
  min_piece_chars: 4
  # 짧은 자막까지 무조건 절 경계에서 가르니 매칭은 늘어도(460->504) 군더더기가
  # 3배(35->102)로 늘었다(재검증, 2026-08-30) — 이미 짧으면 절이 있어도 정답이
  # 안 가른다. 병합 단계에서 여러 조각이 뭉쳐 원래 길어진 자막(권장 상한 3초
  # 초과)에만 절 분할을 켠다.
  clause_split_min_duration_ms: 3000
