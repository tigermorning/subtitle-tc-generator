schema_version: 1

# 예능 / 리얼다큐. 자료가 이 장르에 대해 말하는 것은 **TC 길이 하나뿐**이다.
# 그래서 하나만 적는다 — 없는 값을 지어내지 않는다(규칙 9).
#
# 호칭 규칙은 658·659행이 "다큐/리얼리티 쇼"를 묶어 말하므로 리얼리티 쪽을 따른다.
genre: variety
label: "예능 / 리얼다큐"

source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료/작업 기본 원칙.txt)"
  section: "590·658·659행"
  revision: "2026-08-12"
  verified: "2026-08-12"

address:
  forbid_ssi: true                  # 658행이 "다큐/리얼리티 쇼"를 함께 묶는다
  forbid_super_honorific: true

spotting:
  recommended_ms: [null, 2000]      # "2초 이하" — 하한은 자료에 없다
  recommended_note: "예능·리얼다큐 권장 2초 이하 (작업자 자료 590행)"

# **같은 590행 근거를 병합 단계(regroup.py)에도 적용한다** — 2026-08-27,
# 예능A 15회 영어 번역 1453개 전수 대조로 발견: whisper 전사 조각을
# 묶는 기본 상한(4000ms, `regroup.MAX_DURATION_MS`)이 예능 특유의 빠른 대화
# 주고받기에는 너무 커서, 화자가 바뀌어도 계속 이어 붙였다(`regroup.py`는
# 화자 분리를 못 한다 — whisper가 그 정보를 안 준다). 재분할(resplit)은
# 글자 수가 넘칠 때만 다시 쪼개므로, 짧은 영어 번역문은 4000ms짜리로 뭉친
# 채 그대로 남는다. 병합 자체를 처음부터 최종 목표(2초 이하)에 맞춰 짧게
# 묶으면 이 문제가 원천에서 줄어든다. `regroup.limits_from_profile()`가
# 이 값을 읽는다 — `--genre variety`를 반드시 같이 줘야 적용된다.
timecode:
  merge_max_ms: 2000
  merge_max_gap_ms: 250
  # 2026-08-27 추가 검증: merge_max_ms만으로는 부족했다. 한국어 쪽 병합 개수는
  # 정답 SDH와 거의 같아졌는데(1103 vs 1076), 번역된 영어 최종 자막 개수는
  # 정답의 79%(1150/1453)에 그쳤다. 원인은 resplit.py — 서로 다른 발화 여러
  # 개를 번역해도 84자(42자×2줄) 안에 들어가면 그대로 안 갈랐다. 문장이
  # 끝나는 자리가 중간에 있으면 글자 수와 상관없이 가르게 한다.
  force_sentence_split: true

rules:
  - id: G01
    clause: "작업자 자료 658행 / 호칭"
    check: honorific_ssi_used
    auto: false
    message: "다큐·리얼리티에서는 '~씨' 호칭을 쓰지 않습니다."
  - id: G02
    clause: "작업자 자료 659행 / 극존칭"
    check: super_honorific_used
    auto: false
    message: "다큐·리얼리티에서는 극존칭을 쓰지 않습니다."
