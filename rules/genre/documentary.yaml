schema_version: 1

# 장르 겹치기 — **완전한 프로파일이 아니다.** 플랫폼 프로파일 위에 얹는 조각이다
# (`checker/genre.py`가 얹는다). 다큐멘터리는 넷플릭스에도 쿠팡에도 있으므로
# 플랫폼 밑에 두면 같은 규칙을 여러 벌 적어야 한다.
genre: documentary
label: "다큐멘터리 / 리얼리티"

source:
  official: false
  client: "작업자 실무 자료 (rules/sources/작업자-자료/작업 기본 원칙.txt)"
  section: "312·590·658·659·889행"
  revision: "2026-08-12"
  verified: "2026-08-12"

# 자료 원문:
#   312·889행  "다큐멘터리는 무조건 존댓말. 혼잣말조차 존댓말"
#   658행      "호칭: 다큐/리얼리티 쇼에서는 \"~씨\" 사용하지 말 것. 드라마에선 가능"
#   659행      "극존칭: 다큐/리얼리티 쇼에서는 사용하지 말 것. 드라마에선 가능"
#   590행      "정통 다큐는 3~5초, 드라마는 2~3초, 예능/리얼다큐는 2초 이하로 TC 잡기"

formality:
  # **"무조건 존댓말"보다 좁다.** 사용자 확인: 다큐는 합니다체 위주이고, 자연스러움을
  # 위해 가끔 '요'를 쓰는 것은 **허용된다.** 그래서 줄마다 잡지 않는다 — 허용되는
  # 것을 위반으로 부르면 오답이다.
  #
  # 비율은 리포트에 숫자로만 낸다. **임계값을 두지 않았다** — "가끔"이 몇 퍼센트인지는
  # 완성본 다큐 자막으로 재야 알고, 근거 없는 임계값은 오답 공장이다.
  prefer: 합니다체
  polite_allowed: true
  polite_ratio_threshold: null      # 재기 전까지 판정하지 않는다

address:
  # 이름 뒤 `~씨`는 기계가 확정할 수 있다(이름 + 씨). 문장을 다시 써야 고쳐지므로
  # 자동 교정은 하지 않고 지적만 한다.
  forbid_ssi: true
  forbid_super_honorific: true      # 검사는 미구현 — 아래 규칙에 그대로 밝힌다

spotting:
  # **권장이지 규정이 아니다.** 플랫폼이 정한 최소·최대(`limits`)는 그대로 두고,
  # 이 범위를 벗어난 것은 위반이 아니라 숫자로 낸다(규칙 4·5).
  recommended_ms: [3000, 5000]
  recommended_note: "정통 다큐 권장 3~5초 (작업자 자료 590행)"

rules:
  - id: G01
    clause: "작업자 자료 658행 / 호칭"
    check: honorific_ssi_used
    auto: false
    message: "다큐·리얼리티에서는 '~씨' 호칭을 쓰지 않습니다."
  - id: G02
    clause: "작업자 자료 659행 / 극존칭"
    check: super_honorific_used
    auto: false
    message: "다큐·리얼리티에서는 극존칭을 쓰지 않습니다."
    # **검사기가 아직 구현하지 않았다.** 자료에 "쓰지 말 것"만 있고 무엇이 극존칭인지
    # 정의가 없어, 무늬를 지어내면 오답이 난다. 미구현으로 남겨 리포트에 뜨게 한다
    # (규칙 9: 조용히 통과시키지 않는다).
