# 2026-08-26: 영화A(2026) + 영화D, 둘 다 영어 원어 SDH.
#
# **영화A**는 서로 다른 릴리스 그룹(BONE·KyoGo) 둘을 대조해 SDH
# 자막이 바이트 단위로 완전히 같은 것을 확인했다 — 신뢰도가 높다.
#
# **영화D**은 블루레이 릴리스인데, 영어 SDH 트랙 제목에 **"SDH / AMZN"이라
# 발주처가 명시돼 있어서** 아마존으로 분류했다(추측 아님 — 트랙 자체에 적혀
# 있었다). 나머지 언어(스페인어·덴마크어 등)는 그림 자막(dvd_subtitle)이라
# 못 썼다.
#
# 작품 2편 — 규칙 11: 아직 규정으로 승격하지 않는다.
#
# 줄당 최대 42자 — 넷플릭스 영어 규정 상한과 같다. 두 작품째도 우연히
# 같은 숫자가 나왔는데, 아직 단정하지 않는다(사용자 지시 — 여러 독립된
# 작품이 쌓여야 규정을 역으로 추정할 근거가 된다).

