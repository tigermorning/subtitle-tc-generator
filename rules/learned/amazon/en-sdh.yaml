# 2026-08-26: 영화A (2026), 영어 원어 SDH. 한국어·일본어·중국어
# 트랙은 이 릴리스에 아예 없어서(우선순위 언어 없음) 영어만 학습했다.
#
# **서로 다른 릴리스 그룹(BONE, KyoGo) 둘을 대조했다** — SDH 자막이
# 바이트 단위로 완전히 같았다. 인코딩 그룹이 달라도 같은 값이 나온다는 건
# 둘 다 아마존 정식 트랙을 그대로 옮겼다는 뜻이라 신뢰도가 높다.
#
# **작품 1편뿐이다.** 규칙 11: 한 작품에서만 나온 것은 규정이 아니라 그
# 작품의 습관이다. 사용자 지시(2026-08-26): 아마존도 중요한 발주처라
# 공식 문건이 없어도 작품이 쌓이면 값이 수렴하는 것으로 규정을 역으로
# 추정해 볼 수 있다 — 다만 그건 **여러 독립된 작품**이 쌓여야 의미가
# 있고(같은 작품의 다른 릴리스는 재작품으로 안 친다), 승격은 여전히
# 사람이 확인한다.
#
# 최대 글자 수가 정확히 42자로 나왔다 — 넷플릭스 영어 규정 상한과 같다.
