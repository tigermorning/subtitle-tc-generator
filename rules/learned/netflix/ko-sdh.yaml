# 자막에서 관측한 값으로 채운다. 규칙 11 — `origin: learned`은 지우지 않는다.
#
# 2026-08-26: 드라마A(회차 6개) + 예능B(회차 8개), 두 작품
# 14개 회차. 둘 다 **한국어가 원어인 예능/토크쇼**고, 한국어 트랙이 화자
# 이름표(`[타잔]`·[나 PD] 등)를 달고 있어 SDH로 분류했다 — 규칙 5: SDH와
# 번역은 섞지 않는다.
#
# 이 작품은 한국어가 원어다. `en-translation.yaml`·`ja-translation.yaml`·
# `zh-translation.yaml`에 있는 진짜 번역(한국어 → 영어·일본어·중국어)과는
# 다른 파일이다.
#
# forced 트랙은 뺐다. 예능B는 릴리스에 트랙 제목이 아예 없어서
# forced를 disposition 플래그로 걸렀고(제목 문자열만으로는 못 걸렀다 —
# `tools/corpus_build.py` 버그로 발견해 고쳤다), 영어·일본어·중국어는
# 후보가 여럿이라 **사용자가 실제 넷플릭스 화면과 대조해서** 어느 트랙이
# 진짜인지 확인해 줬다.
#
# 규정이 이미 값을 정한 항목(줄당 글자 수 16자, 읽기 속도 14자/초)은 여기 없다.

