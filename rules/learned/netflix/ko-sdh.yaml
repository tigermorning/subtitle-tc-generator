# 규정(`rules/netflix/common.yaml`·`ko-sdh.yaml`)이 비워 둔 자리를 실제 SDH
# 자막에서 관측한 값으로 채운다. 규칙 11 — `origin: learned`은 지우지 않는다.
#
# 2026-08-26: 드라마A(6부작) + 예능B(8부작) + 예능A
# 시즌2(2회차 — 15·16회. 19회는 파일 손상으로 뺌, 아래 참고). 셋 다
# **한국어가 원어인 드라마/예능**이고, 한국어 트랙이 화자 이름표나
# 효과음 표기를 달고 있어 SDH로 분류했다 — 규칙 5: SDH와 번역은 섞지 않는다.
#
# 예능A는 "KOR"(일반)·"KOR SDH" 트랙이 따로 있었다 — 일반 쪽은 대괄호
# 표기가 0건이라 순수 대사 전용이었다. 그런데 **여기 넣지 않았다** — 이서진의
# 달라달라 때와 같은 이유로, 원어 그대로인 한국어 자막의 페이싱은 번역
# 자막과 다른 성격이라(규칙 11 정신) 섞지 않는다. 아직 이 값을 넣을 마땅한
# 자리(kind)가 없어서 일단 보류한다.
#
# **예능A 19회는 파일이 손상됐다.** ffmpeg가 곳곳에서 "invalid EBML
# 헤더" 경고를 냈고, 15·16회는 자막이 영상 끝까지 이어지는데 19회만
# 영상 37분 중 30분에서 뚝 끊겼다(큐 개수도 다른 회차의 1/20 수준). 15·16회는
# 자막이 영상 끝까지 정상적으로 이어지는 것을 확인해서 그대로 썼다.
#
# **15회도 완전히 멀쩡하진 않다(2026-08-27 재확인).** 컨테이너 전체에 EBML
# 오류가 흩어져 있다(01:25~57:12, 46곳) — 다만 19회처럼 한 지점에서 통째로
# 끊기는 게 아니라, ffmpeg가 손상 지점마다 다시 튕겨 나와(resync) 자막 트랙은
# 영상 끝까지 커버한다. 영어 번역 트랙과 대조해 확인: 4초 넘는 빈 구간 135개
# 중 106개에서 영어 쪽엔 내용이 있는데(그중 100개는 화면 캡션이 아니라 진짜
# 대사), 한국어 SDH엔 없다 — 즉 이 회차 안에서 실제 대사 캡션이 군데군데
# 빠졌다(정확한 개별 큐 수는 안 셈, 최소 100곳 이상의 구간에 걸침).
#
# **그래도 값은 안 고쳤다.** 빠진 자리는 통계에 애초에 안 들렸을 뿐 — 있는
# 자막은 여전히 정답 트랙에서 그대로 옮긴 100% 확실한 값이다(추정 아님).
# 손상 원인이 바이트 단위 파일 오류라 대사 길이·속도와 상관관계를 가질 이유가
# 없고, 예능A가 이 풀링에서 차지하는 비중(1728/8339줄, 21%) 안에서 표본이
# 조금 작아진 정도라 전체 분포를 크게 흔들 것으로는 안 본다. 다만 표본
# 크기(줄_합계)가 이 회차만큼은 "온전한 회차보다 작은 표본"이라는 것을
# 밝혀 둔다. 16회는 아직 같은 방식으로 재확인하지 않았다 — 다음에 할 것.
#
# 이 작품들은 한국어가 원어다. `en-translation.yaml`·`ja-translation.yaml`·
# `zh-translation.yaml`에 있는 진짜 번역(한국어 → 영어·일본어·중국어)과는
# 다른 파일이다.
#
# 규정이 이미 값을 정한 항목(줄당 글자 수 16자, 읽기 속도 14자/초)은 여기 없다.

