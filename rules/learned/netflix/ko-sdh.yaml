# 규정(`rules/netflix/common.yaml`·`ko-sdh.yaml`)이 비워 둔 자리를 실제 SDH
# 자막에서 관측한 값으로 채운다. 규칙 11 — `origin: learned`은 지우지 않는다.
#
# 2026-08-25: 드라마A(회차 6개), 2,890줄. **한 작품뿐이다** — 규칙 11:
# "한 작품에서만 나온 것은 규정이 아니라 그 작품의 습관이다." forced 트랙은 뺐다.
#
# **이 작품은 한국어가 원어다.** 그래서 `ko-translation.yaml`(영화E,
# 영어 원어 → 한국어 번역)과 섞지 않았다 — 사용자 지적(2026-08-25): 번역 자막은
# 이미 정해진 원어 타이밍 칸에 맞춰야 하고, 원어 그대로인 자막은 그 언어 자체의
# 발화 속도로 타이밍이 잡힌다. 다른 성격의 자료라 가를 수 있으면 가른다. 다만
# 노출 시간(duration_ms)까지 다른지는 아직 작품이 둘뿐이라 실측으로 증명 못 한다 —
# 그래서 `duration_ms`는 잠정 비교만 남기고 단정하지 않는다.
#
# 이 작품에서 나온 진짜 번역(한국어 → 영어·일본어·중국어)은 따로
# `en-translation.yaml`·`ja-translation.yaml`·`zh-translation.yaml`에 있다.
#
# 규정이 이미 값을 정한 항목(줄당 글자 수 16자, 읽기 속도 14자/초 — 번역의 12자/초와
# 다르다)은 여기 없다.
#
# **정정(2026-08-25).** 처음 뽑았을 때 `corpus_build.py`의 `bare()`가 `[흥미로운
# 음악]`처럼 대사 없이 효과음만 있는 정상 SDH 자막을 "빈 자막" 오류로 잘못 셌다
# (회차당 100~240건). 화자 표시를 떼는 정규식이 효과음 대괄호에도 걸린 것이었다 —
# 사용자 지적으로 잡았다. 고치고 다시 뽑았다. 아래 수치는 고친 뒤 값이다.

