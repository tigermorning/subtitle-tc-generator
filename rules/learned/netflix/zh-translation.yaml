# `rules/netflix/`에 중국어 공식 프로파일이 아직 없다 — **추측해서 만들지
# 않는다**(규칙 9). 그래서 아래 값은 규정이 비워 둔 자리를 채운 게 아니라,
# 프로파일 자체가 없는 상태에서의 순수 관측이다. 공식 문건이 생기기 전까지는
# 참고용이다.
#
# 2026-08-25: 드라마A(회차 6개), **한국어 원어 → 중국어 번역**.
# 간체(zh-Hans)·번체(zh-Hant) 두 트랙이 있는데, 회차마다 쌍 개수가 정확히
# 같아서(예: 1화 238쌍씩) **같은 타임코드를 쓰는 같은 번역의 표기 변형**으로
# 보고 노출·간격은 번체 트랙 하나만 쟀다 — 시각적 글자 수는 간체/번체가 다를 수
# 있어 그 값은 이 트랙에만 해당한다.
#
# **글자 수·CPS는 가중치가 없다.** 한국어(CJK 1자·그 외 0.5자)처럼 검증된
# 가중치표가 중국어엔 없어서 그냥 센 글자 수다 — 다른 언어와 직접 비교하지 않는다.

