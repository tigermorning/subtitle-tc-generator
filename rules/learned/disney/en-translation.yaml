# `rules/private/disney/`에 영어 프로파일이 아직 없다(한국어만 있다) — 추측해서
# 만들지 않는다(규칙 9). 아래 값은 규정이 비워 둔 자리를 채운 게 아니라,
# 프로파일 자체가 없는 상태에서의 순수 관측이다.
#
# 2026-08-25: 드라마C(회차 2개), **한국어 원어 → 영어 번역**. 이 작품은
# 한국어가 원어인데 이 릴리스엔 한국어 자막 트랙 자체가 없다(음성이 한국어라
# 필요 없어서로 보인다) — 그래서 영어를 직접 원어 자리에 놓고 재지 않았다.
# 회차 2개뿐 — 규칙 11: 아직 규정으로 승격하지 않는다.
#
# **줄당 글자 수가 47자까지 나온다** — 넷플릭스 영어 규정(42자)보다 높다.
# 발주처가 다르면 잣대도 다르다(규칙 2·5). 디즈니+ 공식 문건이 없어 이게
# 발주처 기준인지 이 작품만의 습관인지는 아직 모른다.

