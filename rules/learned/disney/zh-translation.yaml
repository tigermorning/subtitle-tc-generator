# `rules/disney/`에 중국어 프로파일이 없다 — 추측해서 만들지 않는다(규칙 9).
# 순수 관측이다.
#
# 2026-08-26: 다큐A(다큐, 영어 원어) + 드라마C(드라마
# E04~06, 한국어 원어) → 중국어 번역. 일본어 파일과 같은 이유로 원어가
# 다른 두 작품을 합쳤다.
#
# 간체·번체를 계속 따로 잰다 — 다큐A에서 이미 확인했듯
# 자막 개수 자체가 다른 경우가 있어(다른 벤더가 따로 만든 번역일 수
# 있음) 같은 타이밍이라고 가정하지 않는다.
#
# 드라마C의 중국어 트랙은 제목에 출처 표시가 없다 — 릴리스 자체
# (DSNP)에서 온 것으로 보고 디즈니+로 분류했다(영어만 "Viki Ver."·
# "HBO Ver."로 따로 표시돼 있었다).
#
# 번체는 다큐A 1~3화만 있다(4~5화는 릴리스에 없음).
#
# **글자 수·CPS는 가중치가 없다.**

