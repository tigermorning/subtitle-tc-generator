# `rules/disney/`에 중국어 프로파일이 없다 — 추측해서 만들지 않는다(규칙 9).
# 순수 관측이다.
#
# 2026-08-25: 다큐A(다큐), 영어 원어 → 중국어 번역.
#
# **간체와 번체가 이번엔 같은 타이밍이 아니다.** 넷플릭스(이서진의 달라달라)
# 때는 회차마다 쌍 개수가 정확히 같아서 같은 번역의 표기 변형으로 보고 하나만
# 쟀는데, 이 작품은 **자막 개수 자체가 다르다**(간체 2,714 vs 번체 2,011,
# 번체는 전부 한 줄인데 간체는 두 줄도 있음) — 서로 다른 벤더가 따로 만든
# 번역으로 보인다. 그래서 **둘 다 따로** 쟀다.
#
# 홍콩 번체(Chinese (Hong Kong SAR China))도 트랙이 있지만 이번엔 안 쟀다 —
# 표준 번체와 겹치는 범위라 우선순위 밖(사용자 지시: 한국어 SDH·영어·일본어·
# 중국어가 핵심).
#
# 번체는 5화 중 1~3화만 있다(4~5화는 릴리스에 없음). 간체는 5화 다 있다.

