# 2026-08-30: 드라마B(드라마, E01~05) mkv에 내장된 정식 한국어 SDH
# 트랙 5개 전수 학습. 트랙 번호가 회차마다 다르다(E01·E02는 #3, E03~05는
# #2) — 회차마다 큐 수를 정답 대조 결과(755·961·868·843·844)와 대조해
# 어느 트랙이 SDH인지 확인한 뒤 뽑았다. 각 회차에 있던 다른 쪽 트랙(강제
# 자막 아님, 순수 대사만 담은 별개 트랙으로 보임)은 SDH도 번역도 아니라
# 지금은 학습하지 않는다.
#
# `rules/disney/ko-sdh.yaml`(공식 규정)엔 이미 스펙(0.834~7초, 16자,
# 14 CPS)이 있다 — 이 학습값은 그 범위 **안 어디를 실제로 쓰는지**를
# 채운다(규칙 11). 실측 중앙값(1710ms, 9.5자, 6.4 CPS)이 규정 상한보다
# 훨씬 낮다 — 규정은 여유를 넉넉히 두고, 실무는 그 안에서 훨씬 촘촘하게
# 쓴다는 뜻.
#
# **`chars_per_cue` 추가(2026-09-01, T14 — 같은 소스 트랙으로 재추출, 나머지
# 값 전부 바이트 단위로 일치 확인함).** `chars_per_line`(줄 하나의 최댓값)과
# 다르다 — 자막 한 장 전체(모든 줄 합)의 글자 수다. `resplit.py`가 실제로
# 쓰는 상한(`per_line * max_lines` = 32)과 같은 단위라야 학습값을 그
# 알고리즘에 바로 견줄 수 있다. `chars_per_line`만으로 줄 수 분포를 다시
# 곱해 유도하면(9.5 × 평균 줄수 1.26 ≈ 12) 실제 cue 단위 실측값보다 낮게
# 나와 부정확했다 — 그래서 새 지표를 따로 뽑았다.
#
# **위 "다른 측정치와 안 맞음" 메모는 해소됐다(2026-09-01, 같은 세션).**
# `checker/evaluate.py`의 `summarize()`가 `chars_per_cue`를 `count_chars()`
# **가중치 없이**(전부 1.0) 재고 있었다 — `_evaluate_mode`(cli.py)가 애초에
# 프로파일을 안 불러왔다. 그래서 `--against`가 낸 truth_median(14~15)이
# 이 학습값(11.0)보다 부풀어 보였을 뿐, 실측이 서로 다른 게 아니었다.
# `evaluate.py`가 이제 프로파일의 `char_weights`를 받는다(`summarize`/
# `report`/`save`에 `char_weights` 매개변수 추가, `_evaluate_mode`가
# `-p/-l/-k`로 불러와 넘긴다). 고친 뒤 재검증(E02~05, 같은 소스):
# truth_median 11.5~12.5로 이 학습값(11.0)과 정확히 맞아떨어짐. 이 버그는
# **한국어를 대상으로 한 모든 과거 `--against` 실행에 있었다** — 이전
# eval.json·리포트의 "자막 길이" 수치는 전부 부풀려져 있었다는 뜻이다
# (상대 비교 방향은 대체로 안 바뀜, 절대값만 부정확했다).

