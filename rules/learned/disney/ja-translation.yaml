# `rules/disney/`에 일본어 프로파일이 없다 — 추측해서 만들지 않는다(규칙 9).
# 순수 관측이다.
#
# 2026-08-26: 다큐A(다큐 5화, 영어 원어 → 일본어) + 드라마C의
# 세포들3(드라마 3화 — E04~06, 한국어 원어 → 일본어). **원어가 다른 두
# 작품을 합쳤다** — 둘 다 "일본어가 아닌 언어에서 번역"이라는 점은 같고,
# 일본어 자체가 원어인 작품은 아직 없어서 지금은 합쳐도 다른 성격이
# 섞이는 문제는 아니라고 봤다. 원어가 영어냐 한국어냐에 따라 갈라야
# 할 이유가 생기면 그때 나눈다.
#
# **일본어가 세 작품 연속 정상이었다**(회차당 오류 0~5건, 전부 사소한
# 겹침). 이서진의 달라달라만 롤업 형식이라 못 썼다 — 그 릴리스 하나의
# 관행으로 굳어진다.
#
# 드라마C의 일본어 트랙은 제목에 출처 표시가 없다(영어는 "Viki
# Ver."·"HBO Ver."로 명시돼 있었다) — 표시가 없는 트랙은 릴리스 자체
# (DSNP)에서 온 것으로 보고 디즈니+로 분류했다.

