# 직접 확인해 보니 전부 **대사 자막과 화면 정보(장면 전환 카드·PPL 상표
# 자막)가 잠깐 동시에 떠 있는 자리**였다(예: "(事发两天后)" 장면 전환 카드가
# 대사 끝자락과 겹침, "(永林)" 상표 자막이 대사와 겹침). 일본어 롤업처럼
# 자막 하나가 조각나는 문제가 아니라, **대사 채널과 화면 정보 채널이 한
# 자막 파일에 안 갈리고 같이 있는 것뿐**이다 — 각 줄 자체는 온전하다. 그래서
# 학습에는 썼다.

