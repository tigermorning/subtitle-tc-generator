# 2026-08-26: 드라마E, S01E01~04·E06 5개 회차
# (E05는 쿠팡플레이 릴리스라 다른 발주처). 한국어 원어 → 중국어 번역
# (간체·번체 둘 다 있음, 각각 쟀다).
#
# **"자막 겹침" 오류가 났는데 깨진 자료가 아니다.** 회차마다 7~27건씩
# 났는데 전부 **대사 자막과 화면 정보(영상 조회수 카드·구독자 수·PPL
# 상표·삽입곡 정보)가 잠깐 동시에 떠 있는 자리**였다(예: "(百万点击 自制
# 一人也能轻松搞定的门柄)" 조회수 카드, "(STAYC《ASAP》)" 삽입곡 표시가
# 대사와 겹침). 대사 채널과 화면 정보 채널이 한 자막 파일에 안 갈리고
# 같이 있는 것뿐 — 각 줄 자체는 온전해서 학습에 썼다.

