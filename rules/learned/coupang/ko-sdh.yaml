# 규정(`rules/coupang/common.yaml`·`ko-sdh.yaml`)이 비워 둔 자리를 실제
# SDH 자막에서 관측한 값으로 채운다. 규칙 11 — `origin: learned`은 지우지
# 않는다. **쿠팡플레이 첫 학습 자료다.**
#
# 2026-08-26: 드라마E E05(쿠팡플레이 릴리스,
# WEB-DL). 같은 작품을 VIU에서도 받았는데(E01~04·06) 그건 발주처가
# 달라 따로 뒀다 — 발주처가 다르면 규정도 다르다(규칙 2·5).
#
# 효과음·음악 표기가 있어("[어둡고 비밀스러운 음악]") SDH로 분류했다.
# 한국어가 원어라 이 작품은 "번역"이 아니라 원어 SDH다.
#
# 회차 1개뿐 — 규칙 11: 아직 규정으로 승격하지 않는다.
#
# 규정이 이미 값을 정한 항목(줄당 글자 수 16자, 읽기 속도 14자/초)은 여기 없다.

