# `rules/bluray/`가 없다 — 발주처를 모른다(규칙 9). 이 영화(영화C, 2026)는
# 어느 스트리밍 플랫폼 라벨도 없이 블루레이 릴리스로만 존재해서, 추측해서
# 발주처를 붙이지 않고 "블루레이"라는 매체로만 구분했다. 순수 관측이다.
#
# **한국어 트랙의 출처가 불확실하다.** 영어·불어·서어는 mkv 안에 내장된
# 디스크 자체 트랙인데, 한국어만 옆에 딸린 .smi 파일이다(디스크에 없던 것을
# 누군가 따로 만들어 붙인 것으로 보인다 — 공식 스트리밍 발주처 자료와 달리
# **작업자를 특정할 수 없다**). 그래서 다른 학습 파일보다 신뢰도가 한 단계
# 낮다고 보고 쓴다.
#
# **동기화를 영상 세 지점(초반·중반·종반)에서 직접 프레임을 보고 확인했다**
# (2026-08-25) — 자막 파일이 나온 판본과 이 mkv 판본이 다르면 끝에서 수 초씩
# 어긋나는데(규칙: 판본을 섞지 않는다), 세 지점 모두 자연스럽게 맞았다.
#
# 영화 1편뿐 — 규칙 11: 아직 규정으로 승격하지 않는다.
#
# 색깔 태그(`<font color>`)가 붙은 화면 설명 카드가 5개 섞여 있다(예: "1944년
# 영국", 마지막 자막의 JFK 일화). 일반 대사보다 훨씬 길어서 최대 글자 수(67자)를
# 왜곡한다 — 중앙값·95%는 나머지 1,322개 대사 자막이 대부분이라 믿을 만하다.

