# IWSLT 2025 Subtitling track — ITV Studios dev set(2023-01 배포). 영국 방송사 ITV가
# 제공한 드라마 7편(3개 시리즈, 약 7시간)의 **전문 영어 자막**(화자명·효과음 표기 —
# SDH 성격)과 저해상 영상(320x180, 오디오 온전). 독일어·스페인어 번역도 있으나
# 여기엔 TC 층만 남긴다 — 언어 층은 넘기지 않는다(규칙 2).
#
# **왜 이 자료인가**: 전문 자막 TC + 원본 오디오가 짝지어진 공개 자료는 이것뿐이다
# (2026-09-11 조사, docs/HANDOFF.md 8절). 한국 OTT 정답지에서 배운 TC 관행(여유·
# 붙임·짧은 말 바닥·장면전환)이 다른 나라 발주처에서도 같은 방향인지 보는 "다른
# 발주처 2편째" 근거(규칙 12).
#
# **라이선스**: README "Commercial use of these data is prohibited", 재배포 금지.
# 원문·영상은 저장소에 없다(.tmp/iwslt/). 상용판에서는 이 폴더를 뺀다
# (docs/COMMERCIALIZATION.md 1.6).
#
# **시리즈마다 작업 품질이 다르다** — 셋을 섞어 한 값으로 적지 않는다.
#   B(04·05, 25fps): 장면전환 -2프레임 준수 89%, 아웃점이 VAD 오프셋 ±100ms 안 68%
#      — 전문가가 프레임 단위로 스포팅한 자막. TC 관행은 이 시리즈 값을 본다.
#   A(01~03, 23.976fps): 인점이 VAD 온셋보다 -246ms(사분위 -404/-79)로 이르고 흩어짐.
#      장면전환 준수 7/123. 느슨한 스포팅 — 또는 이 mp4의 오디오 싱크가 밀렸을
#      가능성(확인 못 함).
#   C(06·07, 25fps): 효과음 표기 0, 66%가 붙음(간격 40ms), 인점 -424ms(사분위 -704/-58).
#      전환 준수 4/101, 전환 넘김 41. 같은 이유로 판정 보류.
#
# 측정: tools/itv_tc_probe.py (VAD 대비, 생성 없음 — A층). 2026-09-11.

