# 영어 단어·표현 뜻풀이 사전 — 문자 그대로 옮기면 오역이 되는 자리.
#
# 출처: 작업자 실무 자료 `표기_맞춤법_번역.txt`(rules/sources/작업자-자료) "번역투|오역|
# 윤문" 절의 "원문 의미 살리기" 소절(781~820행). 2026-08-27 사용자 확인 후 분리.
#
# 원칙(번역투 종결어미, 한정사/빈도부사 생략, 현재진행형 등)은 `revise.py`의
# THIRD_PASS_KO 프롬프트에 넣었지만, 이 목록은 넣지 않았다 — 개별 단어 지식이라
# 프롬프트에 넣으면 커지기만 하고 그 단어가 안 나오는 대사에는 쓸모가 없다.
# `ko-sdh-effects.yaml`처럼 필요할 때 찾아보는 참고 자료로 둔다.
#
# **검사가 아니라 참고다.** 목록에 없다고 문제없는 것이 아니고, 있다고 반드시
# 그 뜻인 것도 아니다 — 문맥이 최종 판단이다. `checker/word_sense.py`가 이 파일을
# 읽어 배치 원문에 실제로 걸리는 표현만 골라 1차 번역 프롬프트에 힌트로 붙인다
# (`translate.py`의 `translate_events`). 한국어 교정기(`korean.py`)의
# 국립국어원 API들(어문규범·표준국어대사전·우리말샘·사투리)은 전부 한국어
# 단일언어 자원이라 이 역할을 대신할 수 없다(2026-08-27, 사용자 확인).

schema_version: 1
kind: lexicon
language_pair: en-ko
source:
  official: false
  client: "작업자 실무 자료 (표기_맞춤법_번역.txt '원문 의미 살리기' 절, rules/sources/작업자-자료)"
  verified: "2026-08-27"

entries:
  - phrase: "little"
    note: "'작은'이 아니라 하찮은, 같잖은 쪽 뉘앙스일 때가 많다."
  - phrase: "anything planned"
    note: "'계획'(x) → '약속'(o)."
  - phrase: "basically / essentially"
    note: "'기본적으로'(x) → '~나 마찬가지다'(o)."
  - phrase: "border"
    note: "경계를 이루다 / 둘러싸다 / 에워싸다."
  - phrase: "crafty"
    note: "1. 잔머리를 굴리다·머리를 쓰다 2. 손으로 만들다. 실무에서 2번 뜻을 놓친 사례 있음."
  - phrase: "rather"
    note: "1. 오히려 2. quite(약간, to a slight degree)."
  - phrase: "although"
    note: "1. 비록 ~하다 2. but."
  - phrase: "manage to"
    note: "가까스로 ~하다."
  - phrase: "I can't say (that)"
    note: "~인지 모르겠네."
  - phrase: "visit with"
    note: "'누구랑 같이 오라'(x) → '와서 사람들하고 어울리라'(o)."
  - phrase: "Except (문두)"
    note: "'~을 제외하고'(x). but으로 쓰이는 자리라 '오늘은 다르다'류로 옮긴다."
  - phrase: "block"
    note: "≠ 블록(한국어 '블록'은 block보다 범위가 큼). '요 앞 / 골목'으로 옮긴다."
  - phrase: "condo"
    note: "아파트. '콘도'는 숙박시설이라 다른 뜻."
  - phrase: "representative"
    note: "상담원."
  - phrase: "old man"
    note: "1. 영감(=남편) 2. 아버지."
  - phrase: "problem (음식·섭취 맥락)"
    note: "'중독'이라는 뜻. addict/addiction이 너무 직접적이라 problem으로 순화해 쓴다."
  - phrase: "it's one thing to~, (it's) another thing to~"
    match: "one thing to"
    note: "앞은 별거 아니고 뒤가 대단하다는 구조 — 앞을 한다고 뒤도 되는 건 아니다."
  - phrase: "fire / fires"
    note: "fire=불, fires=발포·발사."
  - phrase: "quickly"
    note: "'빨리' 외에 '난데없이 / 순식간에 / 갑자기' 뜻도 있다."
  - phrase: "defensive position"
    note: "'방어 태세를 취한다'보다 '엄폐 / 매복 중이다' 쪽이 자연스럽다."
  - phrase: "What's happened here is~"
    note: "'그러니까 어떻게 된 거냐면요~ / 상황을 설명하자면~'. 다큐멘터리는 무시하고 옮겨도 됨."
  - phrase: "obviously"
    note: "누가 봐도, 당연히."
  - phrase: "go a long way"
    note: "성공하다, 잘 되다(=멀리 간다)."
  - phrase: "We're not there yet."
    note: "아직 그 수준 안 됐다, 시기상조다."
  - phrase: "Let us"
    note: "'너는 가만히 있어라, 내가 할게' 뉘앙스. 앞에 Maybe가 붙으면 완충 표현이 필요하다."
  - phrase: "only if it's an informed one"
    note: "좀 더 알아보고 나서 ~하게."
  - phrase: "apparently"
    note: "정황상 ~그런 모양이다."
