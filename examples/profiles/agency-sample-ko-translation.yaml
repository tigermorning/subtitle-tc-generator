# 에이전시·발주처 전용 프로파일 예시.
#
# 규정은 절대적 정답이 아니라 **발주처가 요구하는 틀**이다. 같은 넷플릭스 작업이라도
# 에이전시가 자기 기준을 얹는 경우가 있다. 그럴 때 공식 프로파일을 베끼지 말고
# 상속해서 다른 부분만 덮어쓴다 — 공식 값이 개정되면 상속본도 따라간다.
#
# 쓰는 법:
#   python -m checker file.srt --profile examples/profiles/agency-sample-ko-translation.yaml
#
# 이 파일은 예시다. 실제로는 자기 폴더에 두고 발주처마다 하나씩 만들면 된다.

schema_version: 1
platform: netflix          # 어느 플랫폼 납품인지
language: ko
kind: translation          # 상속하려면 부모와 같은 kind 여야 한다(섞임 방지)
extends: ../../rules/netflix/ko-translation.yaml
status: complete

source:
  official: false          # 플랫폼 공식 문서가 아니다
  client: "○○ 에이전시 2026년 자막 지침 v3"   # 대신 어느 지침인지 밝힌다
  section: "넷플릭스 한국어 번역 자막 + 사내 기준"
  revision: "2026-06-01"
  verified: "2026-08-11"

# --- 발주처가 다르게 요구하는 것만 적는다 -----------------------------------

limits:
  chars_per_line: 14       # 넷플릭스는 16자지만 이 발주처는 14자로 조인다
                           # (덮어쓰지 않은 CPS·표시 시간 등은 넷플릭스 값 그대로)
  optimal_cps: 10          # 상한(12)과 별개로 "가능하면 이 이하"
  min_gap_ms: 84           # 자막 간 최소 간격(넷플릭스는 이 규정을 삭제했다)
  merge_shorter_than_ms: 1000   # 이보다 짧은 자막은 병합 검토
  words_per_minute: 160

text:
  ellipsis_char: "..."     # 이 발주처는 점 세 개를 쓴다

# 상위 규칙 끄기. 발주처가 안 보는 규칙을 계속 띄우면 리포트가 노이즈가 되고
# 진짜 지적이 묻힌다.
disable_rules:
  - T06                    # 점 3개 -> … 규칙을 끈다

# 발주처 고유 규칙을 더할 수도 있다. `check` 이름은 검사기에 구현된 것이어야 하고,
# 없으면 "미구현 검사"로 리포트에 표시된다(조용히 건너뛰지 않는다).
rules:
  - id: A01
    clause: "○○ 에이전시 지침 3.2"
    check: line_end_period_or_comma
    auto: true
    message: "줄 끝에는 마침표·쉼표를 쓰지 않습니다(에이전시 지침)."
  - id: A02
    clause: "○○ 에이전시 지침 4.1"
    check: gap_too_short
    auto: false
    message: "자막 사이 간격이 부족합니다."
  - id: A03
    clause: "○○ 에이전시 지침 4.2"
    check: optimal_cps_exceeded
    auto: false
    message: "권장 읽기 속도를 넘습니다(상한은 아닙니다)."
  - id: A04
    clause: "○○ 에이전시 지침 4.3"
    check: too_short_to_stand_alone
    auto: false
    message: "너무 짧은 자막입니다. 앞뒤와 병합을 검토하세요."
  - id: A05
    clause: "○○ 에이전시 지침 4.4"
    check: words_per_minute_exceeded
    auto: false
    message: "분당 어절 수가 많습니다."
